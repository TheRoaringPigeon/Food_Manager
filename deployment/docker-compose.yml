services:
  llm_api:
    build:
      dockerfile: ../deployment/Dockerfile.llm-api
      context: ../llm_api
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_NAME=llm_api
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_HOST=http://fm-llm:11434
      - FM_API=http://fm_api:5001
      - FM_API_SERVICE_USERNAME=Admin
      - FM_API_SERVICE_PASSWORD=Admin@123
      - LAMBDA_IDENTIFY_URL=${LAMBDA_IDENTIFY_URL}
      - LAMBDA_API_KEY=${LAMBDA_API_KEY}
      - USDA_API_KEY=${USDA_API_KEY:-DEMO_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      chromadb:
        condition: service_started
      redis:
        condition: service_started
    shm_size: '2gb'
    networks:
      - fm-net
      - fm-llm-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - fm-net
    volumes:
      - redis_data:/data
    restart: unless-stopped

  fm_api:
    build:
      dockerfile: ../deployment/Dockerfile.fm-api
      context: ../fm_api
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_NAME=fm_db
      - LLM_API=http://llm_api:5002
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - OLLAMA_HOST=http://fm-llm:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      llm_api:
        condition: service_started
    networks:
      - fm-net
      - fm-llm-net
    restart: unless-stopped

  fm_frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.fm-frontend
    environment:
      - VITE_API_URL=http://fm_api:5001
      - VITE_LLM_API_URL=http://llm_api:5002
      - VITE_BASE_PATH=${VITE_BASE_PATH:-/food-manager}
    depends_on:
      - fm_api
    networks:
      - fm-net
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      SCRIPT_NAME: /pgadmin
    networks:
      - fm-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/:/docker-entrypoint-initdb.d/:ro

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_started
    networks:
      - fm-net
    volumes:
      - ./configs/pgadmin/pgpass:/pgadmin4/pgpass
      - ./configs/pgadmin/servers.json:/pgadmin4/servers.json

  chromadb:
    image: chromadb/chroma:1.0.18.dev24
    networks:
      - fm-net
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - chromadb_data:/data/

volumes:
  postgres_data:
  chromadb_data:
  redis_data:

networks:
  fm-net:
    driver: bridge
  fm-llm-net:
    external: true
    name: fm-llm-net
