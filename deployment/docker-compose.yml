version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fm_db
      SCRIPT_NAME: /pgadmin
    ports:
      - "5432:5432"
    networks:
      - fm-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - fm-net
    volumes:
      - ./configs/pgadmin/pgpass:/pgadmin4/pgpass
      - ./configs/pgadmin/servers.json:/pgadmin4/servers.json

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - fm-net
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ollama-models:/root/.ollama
      - ./configs/ollama/entry.sh:/entry.sh:ro
    entrypoint: ["/bin/sh", "/entry.sh"]
    env_file:
      - .env
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:11434"]
    #   interval: 10s
    #   retries: 5
    #   start_period: 5s

  frontend:
    build:
      context: ../
      dockerfile: deployment/Dockerfile.frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - fm-net

  backend:
    build:
      context: ../
      dockerfile: deployment/Dockerfile.backend
    container_name: backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - fm-net
    env_file:
      - .env

  mock:
    build:
      dockerfile: Dockerfile.mock-app
    container_name: mock
    ports:
      - "9090:9090"
    networks:
      - fm-net

  chromadb:
    # Pinning to a specific version because we vibe-coded our own C# client. 
    # This version is not special; it's just that we want to avoid breaking changes on ChromaDB API
    image: chromadb/chroma:1.0.18.dev24
    container_name: chromadb
    ports:
      - "8000:8000"
    networks:
      - fm-net
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - chromadb_data:/data/

volumes:
  postgres_data:
  ollama-models:
  chromadb_data:

networks:
  fm-net:
    driver: bridge