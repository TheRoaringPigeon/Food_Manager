services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      SCRIPT_NAME: /pgadmin
    ports:
      - "5432:5432"
    networks:
      - fm-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/:/docker-entrypoint-initdb.d/:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - fm-net
    volumes:
      - ./configs/pgadmin/pgpass:/pgadmin4/pgpass
      - ./configs/pgadmin/servers.json:/pgadmin4/servers.json

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - fm-net
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ollama-models:/root/.ollama
      - ./configs/ollama/entry.sh:/entry.sh:ro
    entrypoint: ["/bin/sh", "/entry.sh"]
    env_file:
      - .env

volumes:
  postgres_data:
  ollama-models:

networks:
  fm-net:
    driver: bridge