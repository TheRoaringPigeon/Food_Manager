location ~ ^/fm/api/v1/pictures/(\d+)$ {
    content_by_lua_block {
        ngx.header["Access-Control-Allow-Origin"] = "*"
        ngx.header["Access-Control-Allow-Methods"] = "GET, POST, OPTIONS"
        ngx.header["Access-Control-Allow-Headers"] = "Content-Type"

        local matches = ngx.re.match(ngx.var.uri, [[^/fm/api/v1/pictures/(\d+)$]])
        if not matches then
            ngx.status = 400
            ngx.say("Invalid request")
            return
        end

        local chatter_id = matches[1]
        local file_path = "/usr/local/openresty/nginx/html/mock-data/chatter-" .. chatter_id .. "-pictures.json"

        local file = io.open(file_path, "r")
        if not file then
            ngx.status = 404
            ngx.say("File not found")
            return
        end

        local content = file:read("*a")
        file:close()
        ngx.header.content_type = "application/json"
        ngx.say(content)
    }
}

location ~ ^/fm/api/v1/pictures/(\d+)/([a-zA-Z0-9_]+)$ {
    content_by_lua_block {
        ngx.header["Access-Control-Allow-Origin"] = "*"
        ngx.header["Access-Control-Allow-Methods"] = "GET, POST, OPTIONS"
        ngx.header["Access-Control-Allow-Headers"] = "Content-Type"

        -- Extract captures directly from ngx.var.uri using the regex
        local matches = ngx.re.match(ngx.var.uri, [[^/fm/api/v1/pictures/(\d+)/([a-zA-Z0-9_]+)$]])
        if not matches then
            ngx.status = 400
            ngx.say("Invalid request format")
            return
        end

        local chatter_id = matches[1]
        local picture_id = matches[2]

        -- Load the corresponding JSON file
        local file_path = "/usr/local/openresty/nginx/html/mock-data/chatter-" .. chatter_id .. "-pictures.json"
        local file = io.open(file_path, "r")
        if not file then
            ngx.status = 404
            ngx.say("File not found")
            return
        end

        local content = file:read("*a")
        file:close()

        -- Parse JSON using cjson
        local cjson = require "cjson.safe"
        local data = cjson.decode(content)
        if not data or not data.pictures then
            ngx.status = 500
            ngx.say("Invalid JSON format")
            return
        end

        -- Search for picture by ID
        local found_picture = nil
        for _, picture in ipairs(data.pictures) do
            if picture.id == picture_id then
                found_picture = picture
                break
            end
        end

        if not found_picture then
            ngx.status = 404
            ngx.say("Picture not found")
            return
        end

        ngx.header.content_type = "application/json"
        ngx.say(cjson.encode(found_picture))
    }
}
