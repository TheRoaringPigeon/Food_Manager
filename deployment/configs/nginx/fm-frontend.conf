server {
    listen 80;

    # Service worker, manifest, and the SPA entry point must never be cached.
    # index.html is the root of the cache-busting chain: if it's stale the
    # browser never learns that a new SW exists and updates stall on mobile.
    location ~ ^/food-manager/(sw\.js|manifest\.webmanifest|index\.html)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Serve the React SPA. The dist/ directory is copied into
    # /usr/share/nginx/html/food-manager at build time, so asset paths like
    # /food-manager/assets/... resolve correctly.
    location /food-manager {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /food-manager/index.html;
    }

    # Redirect / and any other unmatched path to the app.
    # nginx prefix matching means /food-manager above wins for its own subtree.
    location / {
        return 301 /food-manager;
    }
}
