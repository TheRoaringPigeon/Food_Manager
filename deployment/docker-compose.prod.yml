# Production overlay — run with:
#   docker compose -p fm-prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required vars in .env:
#   CADDY_DOMAIN=home.yourdomain.com
#   VITE_BASE_PATH=/food-manager   (default if omitted)
#   JWT_SECRET_KEY=<strong secret>
#
# Only Caddy (80/443) and pgAdmin (5050) are exposed to the host.
# API, database, and ChromaDB traffic stays internal.

services:
  fm_frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.fm-frontend.production
      args:
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/food-manager}
    environment:
      - VITE_BASE_PATH=${VITE_BASE_PATH:-/food-manager}
    # No hot-reload volumes or exposed ports — Caddy is the only entry point
    ports: []
    volumes: []

  fm_api:
    build:
      dockerfile: ../deployment/Dockerfile.fm-api.production
      context: ../fm_api
    environment:
      - APP_ENVIRONMENT=production

  llm_api:
    build:
      dockerfile: ../deployment/Dockerfile.llm-api.production
      context: ../llm_api
    environment:
      - APP_ENVIRONMENT=production
    ports:
      - "5002:5002"

  pgadmin:
    ports:
      - "5050:80"

  caddy:
    image: caddy:latest
    container_name: fm_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN}
    networks:
      - fm-net
    depends_on:
      - fm_frontend
      - fm_api
      - llm_api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
