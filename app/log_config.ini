[loggers]
keys=root

[handlers]
keys=console

[formatters]
keys=default

[logger_root]
propagate=1
level=INFO
handlers=console
[handler_console]
class=logging.StreamHandler
formatter=defaultstream=ext://sys.stderr

[formatter_default]
format=[%(asctime)-15s] [pid %(process)d - %(threadName)s] %(name)s(%(funcName)s:%(lineno)s) - %(levelname)s: %(message)stderrdatefmt=%Y-%m-%d %H:%M:%S