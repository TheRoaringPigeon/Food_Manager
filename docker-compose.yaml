name: food-manager
services:
  db:
    build:
      dockerfile: Dockerfile.postgres
      context: support_images
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
  backend:
    depends_on:
      - db
    build:
      dockerfile: Dockerfile
      context: backend
    environment:
      - DATABASE_HOST=food-manager-db-1
    ports:
      - "8001:8001"