AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Ingredient identification via Amazon Bedrock vision

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    Description: Secret key that callers must supply in the x-api-key header

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    Environment:
      Variables:
        API_KEY: !Ref ApiKey

Resources:
  IngredientApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  IdentifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: .
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
      Events:
        Identify:
          Type: HttpApi
          Properties:
            ApiId: !Ref IngredientApi
            Path: /identify
            Method: POST

Outputs:
  ApiUrl:
    Description: Base URL for the ingredient identification API
    Value: !Sub "https://${IngredientApi}.execute-api.us-east-1.amazonaws.com/prod/identify"
